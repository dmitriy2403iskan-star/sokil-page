name: Build MK15 Toolkit APK
on:
  push:
    paths:
      - 'mk15-controller-analyzer/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: mk15-controller-analyzer
        run: gradle assembleDebug -PversionCode=${{ github.run_number }} -PversionName=2.0.${{ github.run_number }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MK15-Toolkit-2.0-${{ github.run_number }}
          path: mk15-controller-analyzer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mk15-build-${{ github.run_number }}
          name: MK15 Toolkit 2.0.${{ github.run_number }}
          files: mk15-controller-analyzer/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
